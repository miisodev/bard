name: Bard CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # rustsec/audit-check publishes its findings as a commit Check, and needs
      # this to say so. Without it a finding still fails the step, but with an
      # authentication error instead of the list of advisories.
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          # No step in this workflow pushes, and `bun install` runs npm lifecycle
          # scripts from the dependency graph. Leaving a repository credential
          # in .git/config for the whole job hands all of them one.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Add native build tools to PATH
        shell: pwsh
        run: |
          $cmake = (Get-ChildItem 'C:\Program Files\CMake\bin' -Filter cmake.exe -ErrorAction Stop | Select-Object -First 1).DirectoryName
          "$cmake;C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend and CSS gate
        run: bun run build

      - name: Dependency audit
        run: bun audit

      - name: Rust formatting gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust compile gate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust lint gate
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust test suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The Rust crate lives in src-tauri, and this is load-bearing rather
          # than cosmetic: the action runs `cargo audit --file
          # <working-directory>/Cargo.lock`, and there is no Cargo.lock at the
          # repository root. Without it the audit is pointed at a file that does
          # not exist and the step fails every run — a broken gate that reads as
          # a working one.
          working-directory: src-tauri
        # Policy, and the reason it is not stricter: this action fails the step
        # on a critical advisory and only annotates a Check for informational
        # ones, which is the same shape as the `bun audit` step above it — the
        # JS side hard-fails, and nothing about the Rust graph should be
        # quieter than the JS graph. Measured 2026-09-26 against
        # src-tauri/Cargo.lock: 682 locked packages, 328 of them compiled into
        # the Windows build, 0 vulnerabilities, 8 warnings (6 unmaintained,
        # 2 unsound). Three of those — glib, memmap2, proc-macro-error — are
        # in the lockfile only; `cargo tree --target x86_64-pc-windows-msvc -i
        # <crate>` reports nothing to print, so they are never compiled here.
        # The five unic-* warnings are real and reach the build through
        # urlpattern -> tauri-utils; they are unmaintained, not unsound, and
        # that is the only reason this step is green. Reproduce with
        # `cargo audit --file src-tauri/Cargo.lock` before assuming otherwise.

      - name: Package NSIS installer
        env:
          BARD_NO_GUARDIAN: "1"
        run: bun run tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Validate the Store MSIX package
        run: bun run build:msix

      - name: Upload unsigned CI installer
        uses: actions/upload-artifact@v4
        with:
          name: bard-nsis-msix-ci
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msix/*
            src-tauri/target/release/bard.exe
            src-tauri/target/release/bard.pdb
          if-no-files-found: error
          retention-days: 7
