name: Bard CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Add native build tools to PATH
        shell: pwsh
        run: |
          $cmake = (Get-ChildItem 'C:\Program Files\CMake\bin' -Filter cmake.exe -ErrorAction Stop | Select-Object -First 1).DirectoryName
          "$cmake;C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend and CSS gate
        run: bun run build

      - name: Dependency audit
        run: bun audit

      - name: Rust formatting gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust compile gate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust lint gate
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust test suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust dependency audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package NSIS installer
        env:
          BARD_NO_GUARDIAN: "1"
        run: bun run tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Upload unsigned CI installer
        uses: actions/upload-artifact@v4
        with:
          name: bard-nsis-ci
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bard.exe
            src-tauri/target/release/bard.pdb
          if-no-files-found: error
          retention-days: 7
