name: Bard CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: bard-ci-${{ github.ref }}-r2
  cancel-in-progress: true

jobs:
  desktop:
    needs: [windows, linux, browser, secrets]
    uses: ./.github/workflows/native-smoke.yml
    with:
      candidate_run: ${{ format('{0}', github.run_id) }}

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository history
        run: |
          curl -fsSL --retry 2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all .

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node --test scripts/release-metadata.test.mjs
      # The runner image includes Chrome and its OS libraries. Reuse it rather
      # than downloading a second browser and running another apt transaction.
      - run: google-chrome --version
      - run: bun run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: test-results/
          retention-days: 3

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # No step in this workflow pushes, and `bun install` runs npm lifecycle
          # scripts from the dependency graph. Leaving a repository credential
          # in .git/config for the whole job hands all of them one.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      # Without a cache every run compiled the whole dependency graph from cold
      # several times over and ran into the timeout with every gate green.
      # Restore only. Saving this target directory on the Windows runner hangs
      # in the post-job step indefinitely, holding the job (and the PR's
      # concurrency group) long after every gate has finished.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Add native build tools to PATH
        shell: pwsh
        run: |
          $cmake = (Get-ChildItem 'C:\Program Files\CMake\bin' -Filter cmake.exe -ErrorAction Stop | Select-Object -First 1).DirectoryName
          "$cmake;C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend and CSS gate
        run: bun run build

      - name: Dependency audit
        run: bun audit

      - name: Rust formatting gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lint gate
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust test suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # A prebuilt cargo-audit: rustsec/audit-check compiled it from source,
      # which cost twelve minutes of a job with a timeout. Fails on a
      # vulnerability; unmaintained/unsound warnings are reported, not fatal
      # (12 as of 2026-10-18, all informational or outside the Windows build).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependency audit
        run: cargo audit --file src-tauri/Cargo.lock

      # Unsigned validation artifacts only. Updater keys and publication stay
      # on the release operator's machine and are never present in this job.
      - name: Windows installer candidate
        run: bun run tauri build --bundles nsis --no-sign

      - uses: actions/upload-artifact@v4
        with:
          name: windows-candidate
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bard.exe
            src-tauri/target/release/*.dll
          if-no-files-found: error
          retention-days: 3

  linux:
    runs-on: ubuntu-latest
    # Packages link against glibc from the oldest supported Ubuntu baseline.
    # The host image may advance without raising the delivered binary's ABI.
    container: ubuntu:22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Install baseline build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ca-certificates git curl wget unzip file build-essential cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libx11-dev libxtst-dev libxi-dev zstd rpm xvfb xauth

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      # Scoped to this job: the two jobs share a repository but never a target
      # directory, so each gets a key of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend and CSS gate
        run: bun run build

      - name: Dependency audit
        run: bun audit

      - name: Rust formatting gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lint gate
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust test suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # The same prebuilt cargo-audit the Windows job uses.
      - name: X11 clipboard and shortcut integration
        run: xvfb-run -a cargo test --locked --manifest-path src-tauri/Cargo.toml x11_integration -- --ignored

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependency audit
        run: cargo audit --file src-tauri/Cargo.lock

      # Proves the Linux link end to end: compiles the crate for real, links
      # WebKitGTK and the audio stack, and packs a .deb and an .rpm. `--no-sign`
      # because the base config enables updater artifacts — a deb is a
      # self-contained updater target, so the CLI wants an updater key — and CI
      # holds none. Signing belongs to the release machine, not to this gate.
      - name: Linux bundle
        run: bun run tauri build --bundles deb,rpm --no-sign

      - name: Inspect Linux package dependencies
        run: |
          dpkg-deb -I src-tauri/target/release/bundle/deb/*.deb
          rpm -qpR src-tauri/target/release/bundle/rpm/*.rpm
          readelf --version-info src-tauri/target/release/bard | grep GLIBC_ | sort -u

      - uses: actions/upload-artifact@v4
        with:
          name: linux-candidate
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 3
