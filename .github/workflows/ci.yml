name: Bard CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # No step in this workflow pushes, and `bun install` runs npm lifecycle
          # scripts from the dependency graph. Leaving a repository credential
          # in .git/config for the whole job hands all of them one.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      # Without a cache every run compiled the whole dependency graph from cold
      # several times over and ran into the timeout with every gate green.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Add native build tools to PATH
        shell: pwsh
        run: |
          $cmake = (Get-ChildItem 'C:\Program Files\CMake\bin' -Filter cmake.exe -ErrorAction Stop | Select-Object -First 1).DirectoryName
          "$cmake;C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend and CSS gate
        run: bun run build

      - name: Dependency audit
        run: bun audit

      - name: Rust formatting gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lint gate
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust test suite
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # A prebuilt cargo-audit: rustsec/audit-check compiled it from source,
      # which cost twelve minutes of a job with a timeout. Fails on a
      # vulnerability; unmaintained/unsound warnings are reported, not fatal
      # (8 as of 2026-09-29, all informational or outside the Windows build).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependency audit
        run: cargo audit --file src-tauri/Cargo.lock
