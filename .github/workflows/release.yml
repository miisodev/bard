name: Bard release checks

# Manual validation of an existing source tag only. Installer builds,
# updater signing and release publication are local owner operations
# through scripts/build-release.ps1; no signing keys or release tokens
# are exposed to this GitHub Actions workflow. Tag pushes trigger nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v2.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'miisodev/bard'
    runs-on: windows-latest
    timeout-minutes: 60
    # No protected release environment: this job has no signer or publisher access.
    permissions:
      contents: read
      # rustsec/audit-check publishes its findings as a commit Check.
      checks: write
    env:
      BARD_NO_GUARDIAN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          # Keep checkout credentials out of dependency and build scripts.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Add native build tools to PATH
        shell: pwsh
        run: |
          $cmake = (Get-ChildItem 'C:\Program Files\CMake\bin' -Filter cmake.exe -ErrorAction Stop | Select-Object -First 1).DirectoryName
          "$cmake;C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install and verify dependencies
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          bun audit

      - name: Rust release gates
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust dependency audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The crate is in src-tauri. Without this the action runs
          # `cargo audit --file ./Cargo.lock`, there is no Cargo.lock at the
          # repository root, and the step fails for the wrong reason.
          working-directory: src-tauri

