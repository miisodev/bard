name: Packaged desktop smoke

on:
  workflow_call:
    inputs:
      candidate_run:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Bard CI run containing the candidate packages
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BARD_DISPOSABLE_TEST_ACCOUNT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch a verified candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$CANDIDATE_RUN" ]; then
            CANDIDATE_RUN=$(gh run list --workflow ci.yml --branch "$HEAD_BRANCH" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$CANDIDATE_RUN"
          # A reusable invocation belongs to the still-running parent CI run.
          # Require every build/review gate, rather than its final conclusion.
          gh run view "$CANDIDATE_RUN" --json jobs --jq '[.jobs[] | select(.name == "windows" or .name == "linux" or .name == "browser" or .name == "secrets")] | length == 4 and all(.[]; .conclusion == "success")' | grep -qx true
          SOURCE_COMMIT=$(gh run view "$CANDIDATE_RUN" --json headSha --jq .headSha)
          # Never test an older binary against changed product sources.
          git diff --exit-code "$SOURCE_COMMIT" HEAD -- src src-tauri package.json bun.lock index.html settings.html draw.html overlay.html
          if [ "$RUNNER_OS" = Windows ]; then ARTIFACT=windows-candidate; else ARTIFACT=linux-candidate; fi
          gh run download "$CANDIDATE_RUN" --name "$ARTIFACT" --dir candidate
          printf 'Candidate run %s, source %s\n' "$CANDIDATE_RUN" "$SOURCE_COMMIT"
      - name: Install native automation tools
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked
      - name: Prepare Linux desktop
        if: runner.os == 'Linux'
        run: |
          # The regional Azure mirror can stall large WebKit downloads. Use
          # Ubuntu's signed archive and bounded retries instead.
          # Hosted images also use mirror+file:/etc/apt/apt-mirrors.txt;
          # changing only ubuntu.sources leaves Azure selected in that file.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors*.txt; do
            if [ -f "$source" ]; then
              sudo sed -i -e 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' "$source"
            fi
          done
          echo 'Acquire::http::Timeout "20"; Acquire::https::Timeout "20"; Acquire::Retries "1";' | sudo tee /etc/apt/apt.conf.d/99-ci-timeout
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends webkit2gtk-driver xvfb dbus-x11 gnome-keyring xclip
          sudo apt-get install -y ./candidate/deb/*.deb
      - name: Prepare Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
          $installer = Get-ChildItem candidate -Recurse -Filter '*setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'Missing installer' }
          $process = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exit $($process.ExitCode)" }
          New-Item -ItemType Directory -Force src-tauri/target/release, native-review | Out-Null
          Copy-Item candidate/bard.exe src-tauri/target/release/bard.exe
          Copy-Item candidate/*.dll src-tauri/target/release/
          ./scripts/build-msix.ps1 -Store
          Copy-Item src-tauri/target/release/bundle/msix/*.msix native-review/
          choco install gsudo --no-progress -y
      - name: Test installed Linux app
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euc 'printf "%s" ci-disposable-keyring | gnome-keyring-daemon --unlock --components=secrets; xvfb-run -a node scripts/native-smoke.mjs /usr/bin/bard'
      - name: Test installed Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA 'Bard/bard.exe'
          if (!(Test-Path $app)) { throw "Installed executable missing: $app" }
          # WebView2 >=150 deliberately ignores debugging environment options
          # in elevated processes. Test as the ordinary user Bard is built for.
          # https://github.com/tauri-apps/wry/issues/1782
          icacls "$env:GITHUB_WORKSPACE" /grant "${env:USERNAME}:(OI)(CI)M"
          & 'C:/tools/gsudo/Current/gsudo.exe' --integrity Medium node scripts/native-smoke.mjs $app
          if ($LASTEXITCODE -ne 0) { throw "Native smoke exit $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-review-${{ runner.os }}
          path: native-review/
          retention-days: 3
