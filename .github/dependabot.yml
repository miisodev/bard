# Bard's dependencies are security-relevant: the app runs a native speech
# engine, links a webview and installs updates, and the release ships a
# software bill of materials for every one of them.
#
# The schedule is monthly and one pull request at a time per ecosystem, on
# purpose. Every dependency pull request runs the whole CI, and the Windows
# job compiles the Rust graph from cold each time, so a weekly bot would spend
# the account's Actions allowance on its own pull requests. Monthly keeps the
# graph moving without the bot becoming the largest consumer of the budget.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    groups:
      # The Rust graph is 650-odd crates. A group keeps the lockfile coherent
      # and the pull request reviewable, instead of sixty of them a month.
      rust-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "build(deps)"
