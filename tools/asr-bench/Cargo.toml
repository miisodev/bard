[package]
name = "bard-asr-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
transcribe-cpp = "=0.2.3"
# Match the application's locked native engine, not just its Rust wrapper.
transcribe-cpp-sys = "=0.2.3"
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
