[package]
name = "bard"
version = "2.0.3"
description = "Capture, dictate, ask."
authors = ["miiso"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
enigo = "0.2"
rdev = "0.5"
cpal = "0.16"
rubato = "0.16"
earshot = "1.2"
# transcribe-cpp covers the whole field, and it is the only engine bard needs.
#
# This briefly carried transcribe-rs as well, on the belief that non-whisper
# architectures required an ONNX engine. They do not. transcribe-cpp 0.2.3
# ships parakeet.h and moonshine_streaming.h beside whisper.h, and every one of
# the sixty-nine models in Handy's catalog — seventeen architectures, from
# canary and gigaam to qwen3_asr and voxtral — is a single GGUF file loaded
# through it. transcribe-rs is their *legacy* ONNX path, not the one in use.
#
# Dropping it removes a blocking shipping hazard it dragged in: ort's default
# features download pyke's prebuilt ONNX Runtime, which runs AVX in a static
# initialiser and crashes at startup on pre-Haswell CPUs.
#
# Note on features: default-features would have to stay off to reach Vulkan and
# per-ISA CPU dispatch, but that makes transcribe-cpp-sys build ggml from
# source, which needs CMake on PATH and a short build path.
transcribe-cpp = "=0.2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
sha2 = "0.10"
zeroize = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
log = "0.4"
anyhow = "1"
ed25519-dalek = "2.1"
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
minisign-verify = "0.2.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
# Keep release symbols/PDB line tables so a customer crash report can be
# symbolized by the release operator. The panic hook still writes useful
# evidence when the PDB is unavailable.
debug = 1
strip = "debuginfo"
