[package]
name = "bard"
version = "0.1.0"
description = "Capture, dictate, ask."
authors = ["miiso"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
enigo = "0.2"
rdev = "0.5"
window-vibrancy = "0.6"
cpal = "0.16"
rubato = "0.16"
earshot = "1.2"
# Two engines, because no single one covers the field:
#   transcribe-cpp  whisper-family GGUF, via ggml
#   transcribe-rs   ONNX — Parakeet, Moonshine, Canary, SenseVoice, GigaAM
# bard shipped with only the first, which is why a cached Qwen3/Parakeet model
# could be installed and then refused at load with "unsupported architecture".
#
# transcribe-cpp stays on its default features. Turning them off makes
# transcribe-cpp-sys build ggml from source, and that build does not currently
# come up on this machine: it shortens paths through a symlink under
# %LOCALAPPDATA%	cs that points at a per-build out/ directory, and CMake fails
# to write into it. Switching to dynamic-backends + vulkan (the Windows
# acceleration story, PARITY B18) needs that same from-source build, so the two
# are one problem and neither is a prerequisite for the ONNX engine below.
transcribe-cpp = "0.2"
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
log = "0.4"
anyhow = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
