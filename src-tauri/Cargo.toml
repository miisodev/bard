[package]
name = "bard"
version = "2.2.0"
description = "Clipboard, Draw and Dictate."
authors = ["miiso"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` serves the shelf's image covers from the app's own images
# directory over the `asset` scheme, streamed by the webview (and range-cached
# by it) instead of a base64 data URL per card. It is the feature Tauri provides
# for exactly this; the alternative was megabytes of string per 4K screenshot
# crossing the IPC and being decoded twice. The scope is registered at runtime
# from `main.rs` and covers only `images\`.
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
rdev = "0.5"
cpal = "0.16"
rubato = "0.16"
earshot = "1.2"
# transcribe-cpp covers the whole field, and it is the only engine bard needs.
#
# This briefly carried transcribe-rs as well, on the belief that non-whisper
# architectures required an ONNX engine. They do not. transcribe-cpp 0.2.3
# ships parakeet.h and moonshine_streaming.h beside whisper.h, and every one of
# the sixty-nine models in Handy's catalog — seventeen architectures, from
# canary and gigaam to qwen3_asr and voxtral — is a single GGUF file loaded
# through it. transcribe-rs is their *legacy* ONNX path, not the one in use.
#
# Dropping it removes a blocking shipping hazard it dragged in: ort's default
# features download pyke's prebuilt ONNX Runtime, which runs AVX in a static
# initialiser and crashes at startup on pre-Haswell CPUs.
#
# Note on features: default-features would have to stay off to reach Vulkan and
# per-ISA CPU dispatch, but that makes transcribe-cpp-sys build ggml from
# source, which needs CMake on PATH and a short build path.
transcribe-cpp = "=0.2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream"] }
sha2 = "0.10"
zeroize = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
log = "0.4"
anyhow = "1"
ed25519-dalek = "2.1"
# The updater's zip feature is compiled out. It pulls zip 4, which carries
# RUSTSEC-2026-0367/0368/0369 (one critical) with the fix only in zip >= 9,
# and the plugin's ^4 constraint cannot reach it. Bard's updates are bare
# NSIS .exe artifacts, so the zip-extraction path never runs. Revisit with
# tauri-plugin-updater 3.x.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
uuid = { version = "1", features = ["v4"] }

# The credential store is the platform's own, chosen at build time: Windows
# Credential Manager through `windows-native-keyring-store`, the D-Bus Secret
# Service (gnome-keyring, KWallet) through `zbus-secret-service-keyring-store`.
# Both are the keyring v1 compatibility store, which is the API
# `credential.rs` speaks.
[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
# Windows synthesises input through its native APIs; the Linux copy uses the
# X11 XTEST extension through x11rb. The default `xdo` backend links libxdo,
# which the Linux packages should not carry.
enigo = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop", "screencast", "background"] }
keyring = { version = "4.2", default-features = false, features = ["v1", "zbus-secret-service-keyring-store"] }
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }
x11rb = "=0.13.2"
# Metadata-only creation time recovers an interrupted legacy Linux trial
# without granting a fresh trial or reading unrelated keyring items.
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
minisign-verify = "0.2.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
# 3, not "s". The size profile was paying for the installer in exactly the
# loops a person feels: every base64 in and out of the IPC, the PNG encoder and
# the whole-timeline JSON, the SHA-256 over a model, and the VAD. "s" typically
# costs 1.3–2.5× there; the installer gains a few hundred kB back, which is
# measured on a release build rather than assumed here.
opt-level = 3
# Keep release symbols/PDB line tables so a customer crash report can be
# symbolized by the release operator. The panic hook still writes useful
# evidence when the PDB is unavailable.
debug = 1
strip = "debuginfo"
