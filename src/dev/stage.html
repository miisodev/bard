<!doctype html>
<!--
  Store and site screenshots, composed from the real windows.

  Dev-only (served by `bun run dev` at /src/dev/stage.html?shot=<name>): each
  shot is a 1600 × 900 frame holding one headline and one or more live Bard
  windows rendered through the browser preview. scripts/shots.mjs captures
  every shot into .agents/files.

  Each frame takes its ground from the tone of the kind it shows — the same
  tonal circles the main window's rows carry — so the gallery and the app are
  one palette.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bard stage</title>
    <script type="module">
      import "@fontsource-variable/inter/opsz.css";
    </script>
    <style>
      :root {
        --ink: #15151a;
        --ink-2: #4c4d56;
        --tone: #eceef4;
        --tone-ink: #3a3f4b;
        --chip: #ffffff;
        font-family: "Inter Variable", "Adwaita Sans", "Segoe UI", system-ui, sans-serif;
        font-optical-sizing: auto;
      }
      html, body { margin: 0; }
      body {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, 0.55), transparent 55%),
          var(--tone);
        -webkit-font-smoothing: antialiased;
      }
      body[data-tone="hero"] { --tone: #ebedf3; --tone-ink: #2c63e6; }
      body[data-tone="link"] { --tone: #dfe7fb; --tone-ink: #2148a8; }
      body[data-tone="dictation"] { --tone: #fbe3d9; --tone-ink: #8e3f20; }
      body[data-tone="draw"] { --tone: #f9edd2; --tone-ink: #744e0c; }
      body[data-tone="image"] { --tone: #dcf0e3; --tone-ink: #1b5a3d; }
      body.dark {
        --ink: #f4f4f7;
        --ink-2: #b0b0b8;
        --tone: #141418;
        --tone-ink: #a9c3fa;
        --chip: #26262c;
        background:
          radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, 0.05), transparent 55%),
          var(--tone);
      }
      .copy {
        position: absolute;
        left: 110px;
        top: 50%;
        transform: translateY(-50%);
        width: 560px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 30px;
        padding: 6px 18px 6px 6px;
        border-radius: 999px;
        background: var(--chip);
        box-shadow: 0 1px 2px rgba(20, 20, 40, 0.06), 0 0 0 1px rgba(20, 20, 40, 0.05);
        font-size: 18px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      body.dark .eyebrow { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08); }
      .eyebrow img { width: 34px; height: 34px; border-radius: 10px; }
      .eyebrow .glyph {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 999px;
        background: var(--tone);
        color: var(--tone-ink);
      }
      .eyebrow .glyph svg { width: 18px; height: 18px; }
      h1 {
        margin: 0 0 22px;
        font-size: 64px;
        line-height: 1.02;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: var(--ink);
        text-wrap: balance;
      }
      p {
        margin: 0;
        font-size: 23px;
        line-height: 1.5;
        letter-spacing: -0.01em;
        color: var(--ink-2);
        text-wrap: pretty;
      }
      .keys { margin-top: 32px; display: flex; gap: 10px; align-items: center; color: var(--ink-2); font-size: 18px; }
      kbd {
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        color: var(--ink);
        padding: 7px 13px;
        border-radius: 10px;
        background: var(--chip);
        box-shadow: inset 0 -2px 0 rgba(20, 20, 40, 0.14), 0 0 0 1px rgba(20, 20, 40, 0.1);
      }
      body.dark kbd { box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.12); }
      .win {
        position: absolute;
        border: 0;
        border-radius: 22px;
        background: transparent;
        box-shadow: 0 50px 100px rgba(20, 20, 40, 0.2), 0 12px 28px rgba(20, 20, 40, 0.1);
      }
      body.dark .win { box-shadow: 0 50px 100px rgba(0, 0, 0, 0.6), 0 12px 28px rgba(0, 0, 0, 0.4); }
      .doc {
        position: absolute;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 50px 100px rgba(20, 20, 40, 0.16), 0 0 0 1px rgba(20, 20, 40, 0.05);
        color: #1b1b20;
        overflow: hidden;
      }
      .doc-bar {
        position: relative;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f3f6;
        border-bottom: 1px solid rgba(20, 20, 40, 0.06);
        color: #1b1b20;
        font-size: 15px;
        font-weight: 600;
      }
      .doc-bar .ctl { position: absolute; right: 16px; top: 14px; display: flex; gap: 10px; }
      .doc-bar .ctl span { width: 24px; height: 24px; border-radius: 999px; background: #e3e3e9; }
      .doc-body { padding: 40px 52px; font-size: 20px; line-height: 1.7; letter-spacing: -0.01em; }
      .doc-body h2 { margin: 0 0 16px; font-size: 30px; letter-spacing: -0.03em; }
      .caret { display: inline-block; width: 2px; height: 24px; background: #2c63e6; vertical-align: -5px; margin-left: 2px; }
      .typed { background: #e2e9fc; border-radius: 6px; padding: 2px 4px; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="headline"></h1>
      <p id="subline"></p>
      <div class="keys" id="keys"></div>
    </div>
    <div id="windows"></div>
    <script type="module">
      // Lucide's glyphs for the eyebrow, matching the app's KindGlyph.
      const GLYPHS = {
        clipboard: '<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
        mic: '<path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/>',
        pen: '<path d="M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z"/><path d="m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.028a1 1 0 0 0-1.207 1.207L5.35 15.879a1 1 0 0 0 .776.746L13 18"/><path d="m2.3 2.3 7.286 7.286"/><circle cx="11" cy="11" r="2"/>',
        cpu: '<path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/>',
        layers: '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/>',
      };
      const chord = (keys, text) => [...keys.map((key) => [key, ""]), text];
      const shots = {
        hero: {
          tone: "hero",
          brand: true,
          headline: "Clipboard, Draw and Dictate.",
          subline: "Bard keeps what you copy, turns your voice into text on your own machine, and hands it all back on the clipboard. Free and open source, for Windows and Linux.",
          keys: [],
          copyTop: true,
          windows: [
            { src: "/draw.html?bare&scene=sketch", x: 640, y: 400, w: 760, h: 580, scale: 0.7 },
            { src: "/?bare&active=2", x: 1090, y: 96, w: 400, h: 620, scale: 1.2 },
            { src: "/pill.html?bare&scene=copied", x: 74, y: 420, w: 480, h: 130, flat: true, scale: 1.2 },
          ],
        },
        capture: {
          tone: "link",
          eyebrow: ["clipboard", "Clipboard"],
          headline: "Nothing you copy gets lost.",
          subline: "Every copy and cut is kept while Bard runs, with a soft pop to say so. Pick one and it is back on your clipboard.",
          keys: chord(["Alt", "Shift", "V"], "opens Bard anywhere"),
          windows: [
            { src: "/?bare&active=2", x: 1100, y: 112, w: 400, h: 620, scale: 1.2 },
            { src: "/pill.html?bare&scene=copied", x: 536, y: 8, w: 480, h: 120, flat: true, scale: 1.1 },
          ],
        },
        slots: {
          dark: true,
          eyebrow: ["layers", "Three slots"],
          headline: "Your top three, one chord away.",
          subline: "Pin what you reuse. Copy slot 1, 2 or 3 from any app, or cycle and watch the badge show where you are.",
          keys: chord(["Alt", "Shift", "1–3"], "or C to cycle"),
          windows: [
            { src: "/?bare&theme=dark&active=2", x: 1100, y: 112, w: 400, h: 620, scale: 1.2 },
            { src: "/pill.html?bare&theme=dark&scene=cycle", x: 536, y: 8, w: 480, h: 190, flat: true, scale: 1.1 },
          ],
        },
        dictate: {
          tone: "dictation",
          eyebrow: ["mic", "Dictate"],
          headline: "Hold a key. Talk. It's on your clipboard.",
          subline: "A local speech model turns it into text and reads it back. Your voice never leaves your computer.",
          keys: chord(["Alt", "Shift", "Space"], "hold to talk"),
          doc: { x: 760, y: 250, w: 740, h: 540 },
          windows: [{ src: "/pill.html?bare&scene=done", x: 512, y: 8, w: 480, h: 170, flat: true, scale: 1.2 }],
        },
        draw: {
          tone: "draw",
          eyebrow: ["pen", "Draw"],
          headline: "Sketch it faster than you can say it.",
          subline: "Pen, arrows, shapes and text on a page of its own. Copy it as an image in one keystroke.",
          keys: chord(["Alt", "Shift", "D"], "to draw"),
          windows: [{ src: "/draw.html?bare&scene=sketch", x: 760, y: 150, w: 740, h: 600 }],
        },
        models: {
          tone: "image",
          eyebrow: ["cpu", "Models"],
          headline: "Two models. Both run here.",
          subline: "Bard runs only the speech models it hosts and verifies. No account, no telemetry, and the source is open.",
          keys: [],
          windows: [{ src: "/settings.html?bare&pane=models", x: 780, y: 150, w: 720, h: 600 }],
        },
      };
      const name = new URLSearchParams(location.search).get("shot") ?? "capture";
      const shot = shots[name];
      if (shot.dark) document.body.classList.add("dark");
      if (shot.tone) document.body.dataset.tone = shot.tone;
      if (shot.copyTop) {
        Object.assign(document.querySelector(".copy").style, { top: "72px", transform: "none", width: "1180px" });
        document.querySelector("h1").style.maxWidth = shot.windows.length > 1 ? "760px" : "1100px";
        document.querySelector(".copy p").style.maxWidth = shot.windows.length > 1 ? "600px" : "760px";
      }
      const eyebrow = document.getElementById("eyebrow");
      if (shot.brand) {
        eyebrow.innerHTML = '<img src="/src-tauri/icons/128x128@2x.png" alt="" />Bard';
      } else {
        const [glyph, label] = shot.eyebrow;
        eyebrow.innerHTML = `<span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${GLYPHS[glyph]}</svg></span>`;
        eyebrow.append(label);
      }
      document.getElementById("headline").textContent = shot.headline;
      document.getElementById("subline").textContent = shot.subline;
      const keys = document.getElementById("keys");
      for (const part of shot.keys) {
        if (Array.isArray(part)) {
          const k = document.createElement("kbd");
          k.textContent = part[0];
          keys.append(k);
          if (part[1]) keys.append(part[1]);
        } else {
          const span = document.createElement("span");
          span.textContent = part;
          keys.append(span);
        }
      }
      const host = document.getElementById("windows");
      if (shot.doc) {
        const d = shot.doc;
        const doc = document.createElement("div");
        doc.className = "doc";
        Object.assign(doc.style, { left: `${d.x}px`, top: `${d.y}px`, width: `${d.w}px`, height: `${d.h}px` });
        doc.innerHTML = `<div class="doc-bar"><span>Launch notes</span><span class="ctl"><span></span><span></span><span></span></span></div>
          <div class="doc-body"><h2>Friday launch</h2>
          The build is signed off and the listing copy is final. What is left is the checklist Lerato asked for this morning.<br/><br/>
          <span class="typed">Send the release notes to the team before noon, and book the venue for the Cape Town evening on the twelfth</span><span class="caret"></span></div>`;
        host.append(doc);
      }
      for (const w of shot.windows) {
        const frame = document.createElement("iframe");
        frame.className = "win";
        frame.src = w.src;
        Object.assign(frame.style, { left: `${w.x}px`, top: `${w.y}px`, width: `${w.w}px`, height: `${w.h}px` });
        if (w.flat) frame.style.boxShadow = "none";
        if (w.scale) {
          frame.style.transform = `scale(${w.scale})`;
          frame.style.transformOrigin = "top left";
        }
        host.append(frame);
      }
    </script>
  </body>
</html>
